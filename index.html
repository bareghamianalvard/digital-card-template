<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name - Digital Card</title>
<style>
  :root { --bg:#0b0d10; --card:#14181d; --line:#232a31; --text:#f2f4f6; --muted:#8b95a1; --green:#34D399; --orange:#F58507; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:32px 24px; text-align:center; }
  .avatar { width:96px; height:96px; border-radius:50%; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:700; color:#0b0d10; background:linear-gradient(135deg,var(--green),var(--orange)); }
  h1 { font-size:24px; }
  .role { color:var(--green); font-size:14px; margin-top:6px; }
  .bio { color:var(--muted); font-size:14px; line-height:1.5; margin:16px 0 24px; }
  .links { display:grid; gap:10px; }
  a.btn { display:block; padding:14px; border:1px solid var(--line); border-radius:12px; color:var(--text); text-decoration:none; font-size:15px; background:transparent; transition:border-color .2s; }
  a.btn:hover { border-color:var(--green); }
  a.primary { background:var(--orange); border-color:var(--orange); color:#0b0d10; font-weight:700; }
  a.primary:hover { border-color:var(--orange); filter:brightness(1.08); }
  #qr { margin:24px auto 0; background:#fff; padding:10px; border-radius:12px; width:fit-content; line-height:0; }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<main class="card">
  <div class="avatar">YN</div>
  <h1>Your Name</h1>
  <p class="role">Your Job Title</p>
  <p class="bio">A short line about what you do.</p>

  <div class="links">
    <a class="btn primary" id="save" href="#">Save contact</a>
    <a class="btn" href="mailto:your@email.com">Email me</a>
    <a class="btn" href="tel:+374XXXXXXXX">Call +374 XX XXX XXX</a>
    <a class="btn" href="https://github.com/YOUR-USERNAME" target="_blank" rel="noopener">GitHub</a>
    <a class="btn" href="https://YOUR-PORTFOLIO-URL" target="_blank" rel="noopener">Portfolio</a>
    <a class="btn" href="https://linkedin.com/in/YOUR-LINKEDIN" target="_blank" rel="noopener">LinkedIn</a>
  </div>

  <div id="qr"></div>
  <p class="hint">Scan to open this card</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // Contact details for the .vcf file
  var vcf = [
    "BEGIN:VCARD", "VERSION:3.0",
    "N:Lastname;Firstname;;;",
    "FN:Your Name",
    "TITLE:Your Job Title",
    "EMAIL;TYPE=INTERNET:your@email.com",
    "TEL;TYPE=CELL:+374XXXXXXXX",
    "URL:https://github.com/YOUR-USERNAME",
    "END:VCARD"
  ].join("\r\n");
  var save = document.getElementById("save");
  save.href = URL.createObjectURL(new Blob([vcf], { type: "text/vcard" }));
  save.download = "Your-Name.vcf";

  // QR code points to this page once it is hosted
  new QRCode(document.getElementById("qr"), { text: location.href, width: 140, height: 140 });
</script>
</body>
</html>
